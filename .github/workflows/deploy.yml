name: Deploy bot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check (fail fast before touching server)
        run: |
          python3 -m pip install --quiet --upgrade pip
          find . -maxdepth 1 -name "*.py" -print0 | xargs -0 -n1 python3 -m py_compile

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /home/CourceBot/deploy.sh
